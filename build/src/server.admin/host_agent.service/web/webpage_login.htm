<!DOCTYPE html>
<HTML>
<HEAD>
    <META NAME="GENERATOR" Content="CGCII.host_agent.control.login">
    <META charset="utf-8">
    <TITLE>CGCII HOST AGENT - login</TITLE>

    <style>
        body {
            margin: 0px;
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        .top_bar {
            height: 60px;
            color: white;
            background-color: #222;
            padding: 0px 20px;
            line-height: 60px;
        }
        .main_box {
            width: 360px;
            margin: 120px auto 0px auto;
            padding: 30px;
            background-color: white;
            box-shadow: 0px 4px 6px 0px rgba(0,0,0,0.4);
        }
        .input_box {
            width: 100%;
            height: 32px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 0px 8px;
            font-size: 14px;
        }
        .button_login {
            margin-top: 16px;
            width: 100%;
            height: 36px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            background-color: #222;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button_login:hover {
            background-color: #444;
        }
        .error {
            display: none;
            margin-top: 12px;
            color: #e00;
            font-size: 13px;
        }
    </style>
</HEAD>
<BODY>
    <div class="top_bar">
        <span style="font-weight:bold;font-size:12px">CGC.II.</span> <span style="font-weight:bold;font-size:22px">HOST AGENT</span>
    </div>
    <div class="main_box">
        <form method="post" action="/login">
            <div style="font-size:14px;margin-bottom:6px">LOGIN KEY</div>
            <input class="input_box" type="password" name="key" autocomplete="current-password" autofocus />
            <button class="button_login" type="submit">LOGIN</button>
        </form>
        <div class="error" id="error">fail to login</div>
    </div>
    <p style="text-align:center;font-size:12px;color:#888;margin-top:30px">copyright 2020. <strong>CGCIII</strong> all right reserved.</p>
    <script>
        if (window.location.search.indexOf("error") >= 0)
            document.getElementById("error").style.display = "block";
    </script>
</BODY>
</HTML>
