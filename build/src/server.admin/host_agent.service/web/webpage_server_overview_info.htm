    <script>
        var websocket;
        var table_event_list_v;
        var div_log_output;

        function init() {
            table_event_list_v = document.getElementById("table_event_list_n");
            div_log_output = document.getElementById("log_output");
        }

        function on_message(_event) {
            let message_type = _event.data.substring(0, 4);

            if (message_type == 'CLOG') {
                on_message_log(_event.data);
            }
            else if (message_type == 'CVLI') {
                on_messsage_event_list(_event.data);
            }
            else if (message_type == 'CGNR') {
                on_messsage_event_general(_event.data);
            }
        }

        function on_message_log(message) {
            let pre = document.createElement("div");
            pre.style.wordWrap = "break-word";
            pre.innerHTML = message.slice(4);
            div_log_output.appendChild(pre);
            div_log_output.scrollTo(0, div_log_output.scrollTop + pre.scrollHeight);
        }
        function on_messsage_event_list(message)
        {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get command type
                let command = message[pos_buf];
                ++pos_buf;

                // 2) get element id
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let element_id = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 3) execute command (A:Add, D:delete, U:update)
                switch (command) {
                    case 'A': // add new
                        {
                            // - get element length
                            pos_buf_new = message.indexOf('\n', pos_buf);
                            let value_length = Number(message.substring(pos_buf, pos_buf_new));
                            pos_buf = pos_buf_new + 1;

                            // - get element innnerHTML;
                            let value = message.substring(pos_buf, pos_buf + value_length);
                            pos_buf = pos_buf + value_length;

                            // - add
                            let pre = document.createElement("tr");
                            pre.innerHTML = value;
                            pre.id = element_id;
                            pre.addEventListener("click", onclick_table_event_list);
                            pre.addEventListener("dblclick", ondblclick_table_event_list);
                            table_event_list_v.appendChild(pre);
                        }
                        break;

                    case 'D': // delete
                        {
                            // - delete 
                            table_event_list_v.removeChild(document.getElementById(element_id));
                        }
                        break;

                    case 'U':
                        {
                            // - get element innnerHTML length
                            pos_buf_new = message.indexOf('\n', pos_buf);
                            let value_length = Number(message.substring(pos_buf, pos_buf_new));
                            pos_buf = pos_buf_new + 1;

                            // - get element innnerHTML;
                            let value = message.substring(pos_buf, pos_buf + value_length);
                            pos_buf = pos_buf + value_length;

                            // - find element
                            let element_update = document.getElementById(element_id);
                            if (element_update != null) {
                                element_update.innerHTML = value;
                            }
                        }
                        break;
                }
            }
        }

        function on_messsage_event_general(message) {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get key
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let key = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 2) get length
                pos_buf_new = message.indexOf('\n', pos_buf);
                let value_length = Number(message.substring(pos_buf, pos_buf_new));
                pos_buf = pos_buf_new + 1;

                // 3) get value;
                let value = message.substring(pos_buf, pos_buf + value_length);
                pos_buf = pos_buf + value_length;

                // 4) fine element
                let element_key = document.getElementById(key);

                if (element_key == null)
                    continue;

                // 5) set value
                element_key.innerHTML = value;
            }
        }

        function onclick_table_event_list(_event) {
            this.classList.toggle("selected");
        }
        function ondblclick_table_event_list(_event) {
        }

        function onclick_table_server_list(_event) {
            this.classList.toggle("selected");
        }
        function ondblclick_table_server_list(_event) {
        }

        function onclick_eventlist_add() {
            let temp = table_event_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("EVAD" + temp[iter].id);
            }
        }
        function onclick_eventlist_remove() {
            let temp = table_event_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("EVRV" + temp[iter].id);
            }
        }
        function onclick_eventlist_start() {

            let temp = table_event_list_v.querySelectorAll('.selected');
            for (let iter in temp)
            {
                websocket.send("EVST" + temp[iter].id);
            }
        }
        function onclick_eventlist_pause() {
            let temp = table_event_list_v.querySelectorAll('.selected');
            for (let iter in temp) {

            }
        }
        function onclick_eventlist_stop() {
            let temp = table_event_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("EVSP" + temp[iter].id);
            }
        }

        function onclick_serverlist_add() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVAD" + temp[iter].id);
            }
        }
        function onclick_serverlist_remove() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVRV" + temp[iter].id);
            }
        }
        function onclick_serverlist_update() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVUD" + temp[iter].id);
            }
        }
        function onclick_serverlist_initialize() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVIN" + temp[iter].id);
            }
        }
        function onclick_serverlist_start() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVST" + temp[iter].id);
            }
        }
        function onclick_serverlist_stop() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVSP" + temp[iter].id);
            }
        }
        function onclick_serverlist_destroy() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVDT" + temp[iter].id);
            }
        }
        function onclick_serverlist_kill() {
            let temp = table_server_list_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVKI" + temp[iter].id);
            }
        }

        window.addEventListener("load", init, false);
    </script>
