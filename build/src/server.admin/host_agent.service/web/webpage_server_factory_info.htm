<HTML>
<HEAD>
    <META NAME='GENERATOR' Content='CGCII HostAgent'>
    <TITLE></TITLE>

    <style>
        *:focus {
            outline: none;
        }
        .head_1 {
            color: #000;
            font-weight: bold;
            font-size: 20px;
        }
        .server_list_button {
            width: 28px;
            height: 24px;
            color: #666;
            vertical-align: bottom;
            border: none;
            background-color: transparent;
            margin: 0px;
            padding: 0px;
            cursor: pointer;
        }
        .server_list_button:hover, .server_list_button:focus {
            color: #000;
            cursor: pointer;
        }

        .table_factory_list {
            margin-left: 5px;
            width: 1200px;
            table-layout: fixed;
        }
          
        .table_factory_list th {
            height: 15px;
            background-color: #888;
            vertical-align: top;
            padding: 0px 0px 2px 4px;
            vertical-align:bottom;
            border-right-width:2px;
            border-right-style:solid;
            border-right-color:#fff;
        }
        .table_factory_list th span {
            table-layout: fixed;
            font-size: 10px;
            font-weight: bold;
            vertical-align: bottom;
            color: #fff;
        }
        .table_factory_list tr {
            height: 14px;
            overflow-x: hidden;
            overflow-y: hidden;
        }
        .table_factory_list tr:hover {
            background-color: #ddd;
            cursor: pointer;
        }
        .table_factory_list tr td {
            table-layout: fixed;
            vertical-align: bottom;
            font-size: 14px;
            padding-left: 2px 3px 3px 4px;
            white-space: nowrap;
            overflow-x: hidden;
            color: #000;
        }

        .button_type {
            background-color: #fff;
            color: #cce;
            border: none;
            padding: 1px;
        }
        .button_type:hover {
            color: #99f;
            border: none;
        }

        .button_type_selected {
            background-color: #fff;
            color: #222;
            border: none;
        }
        .button_type_selected:hover {
            color: #00f;
            border: none;
        }

        .selected {
            background-color: #eee;
    }
    </style>
    <link rel='stylesheet' href='https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css'>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/xeicon@2.3.3/xeicon.min.css'>
</HEAD>
<BODY style='margin-top:0px; margin-left:0px; margin-right:0px'>
    <div style='width: 100%;min-width:1400px'>
        <div width=100% style='overflow-x:hidden; border-width: 0px; min-height:14px'>
            <table width='1200px' height='30px' style="margin-left:0px;">
                <td style='width:200px;height:30px;vertical-align:bottom'>
                    <div class='head_1'>&nbsp;&nbsp;FACTORY LIST</div>
                </td>
                <td width='300px' height='40px' valign='bottom'>
                    <button class='server_list_button' title='register new server' onclick="onclick_table_factory_add()"><i class='xi-folder-add xi-fw'></i></button>
                    <button class='server_list_button' title='unregister server' onclick="onclick_table_factory_remove()"><i class='xi-folder-remove xi-fw'></i></button>
                    <button class='server_list_button' title='update server' onclick="onclick_table_factory_update()"><i class='xi-renew xi-fw'></i></button>
                </td>
                <td style='float:left;flex-grow:1;'>
                </td>
                <td width='250px' height='40px' align='right' valign='bottom'>
                    <button class="button_type" id="checkbox_mem_block_v" title='memory block factory' onclick="onclick_checkbox_mem_block()"><i class='fa fa-th'></i></button>
                    <button class="button_type" id="checkbox_system_v" title='system factory' onclick="onclick_checkbox_system()"><i class='fa fa-cogs'></i></button>
                    <button class="button_type" id="checkbox_user_v" title='user factory' onclick="onclick_checkbox_user()"><i class='fa fa-user-circle'></i></button>
                </td>
            </table>
            <table class='table_factory_list' id='table_factory_list_n' cellspacing='0px'>
                <thead>
                    <tr style='height:20px'>
                        <th style='width:160px;'><span style='float:left'></span></th>
                        <th style='width:50px;'><span style='float:left'>IN USING</span></th>
                        <th style='width:50px;'><span style='float:left'>EXISTING</span></th>
                        <th style='width:70px;'><span style='float:left'>REQUESTED</span></th>
                        <th style='width:60px;'><span style='float:left'>CREATED</span></th>
                        <th style='width:60px;'><span style='float:left'>DELETED</span></th>
                        <th style='width:30px;'><span style='float:left'>STATUS</span></th>
                        <th style='width:45px;'><span style='float:left'>STACKED</span></th>
                        <th style='width:45px;'><span style='float:left'>MAX</span></th>
                        <th style='width:35px;'><span style='float:left'>REUSE</span></th>
                        <th style='width:35px;'><span style='float:left'>D/C</span></th>
                    </tr>
                </thead>
                <tbody id="table_factory_list_body_n">
                </tbody>
            </table>
        </div>
    </div>
    <script>
        var websocket;
        var table_factory_list_body_v;

        function init() {
            table_factory_list_body_v = document.getElementById("table_factory_list_body_n");
        }

        function on_message(_event) {
            let message_type = _event.data.substring(0, 4);

            if (message_type == 'CAGA') {
                on_messsage_factory_list_add(_event.data);
            }
            else if (message_type == 'CAGU') {
                on_messsage_factory_list_update(_event.data);
            }
        }

        function on_messsage_factory_list_add(message)
        {
            // 1) clear table
            table_factory_list_body_v.innerHTML="";

            let pos_buf = 4;
            let len_buf = message.length;

            // 2) set flag
            {
                let check_find = document.getElementById("checkbox_mem_block_v");
                let flag = message[pos_buf];
                ++pos_buf;
                if ((flag == 'C'))
                    check_find.classList.add("button_type_selected");
                else
                    check_find.classList.remove("button_type_selected");
            }
            {
                let check_find = document.getElementById("checkbox_system_v");
                let flag = message[pos_buf];
                ++pos_buf;
                if ((flag == 'C'))
                    check_find.classList.add("button_type_selected");
                else
                    check_find.classList.remove("button_type_selected");
            }
            {
                let check_find = document.getElementById("checkbox_user_v");
                let flag = message[pos_buf];
                ++pos_buf;
                if ((flag == 'C'))
                    check_find.classList.add("button_type_selected");
                else
                    check_find.classList.remove("button_type_selected");
            }

            // 3) add rows
            while (pos_buf < len_buf) {
                // - get element id
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let element_id = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // - get element length
                pos_buf_new = message.indexOf('\n', pos_buf);
                let value_length = Number(message.substring(pos_buf, pos_buf_new));
                pos_buf = pos_buf_new + 1;

                // - get element innnerHTML;
                let value = message.substring(pos_buf, pos_buf + value_length);
                pos_buf = pos_buf + value_length;

                // - add
                let pre = document.createElement("tr");
                pre.innerHTML = value;
                pre.id = element_id;
                table_factory_list_body_v.appendChild(pre);
            }
        }
        function on_messsage_factory_list_update(message)
        {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get element id
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let element_id = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 2) find element
                let element_update = document.getElementById(element_id);

                // check) set 
                if (element_update == null)
                    return;

                // 3) get child noes
                let child_nodes = element_update.childNodes;

                // 4) set value
                for (let i = 1; i < 11; ++i)
                {
                    // - get value
                    pos_buf_new = message.indexOf('\n', pos_buf);
                    let value = message.substring(pos_buf, pos_buf_new);
                    pos_buf = pos_buf_new + 1;

                    if (child_nodes[i].textContent != value) {
                        // - set value
                        child_nodes[i].textContent = value;
                        child_nodes[i].style.color = "#00f";
                        setTimeout(function (node) { node.style.color = "#000"; }, 1000, child_nodes[i]);
                    }
                }
            }
        }

        function on_messsage_event_general(message) {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // - get key
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let key = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // - get length
                pos_buf_new = message.indexOf('\n', pos_buf);
                let value_length = Number(message.substring(pos_buf, pos_buf_new));
                pos_buf = pos_buf_new + 1;

                // - extract value;
                let value = message.substring(pos_buf, pos_buf + value_length);
                pos_buf = pos_buf + value_length;

                // - find element
                let element_key = document.getElementById(key);

                // check) return if not exist
                if (element_key == null)
                    continue;

                // - set value
                element_key.innerHTML = value;
            }
        }

        function onclick_table_factory_list(_event) {
            this.classList.toggle("selected");
        }
        function ondblclick_table_factory_list(_event) {
        }

        function onclick_table_factory_add() {
            let temp = table_factory_list_body_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVAD" + temp[iter].id);
            }
        }
        function onclick_table_factory_remove() {
            let temp = table_factory_list_body_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVRV" + temp[iter].id);
            }
        }
        function onclick_table_factory_update() {
            let temp = table_factory_list_body_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVUD" + temp[iter].id);
            }
        }
        function onclick_table_factory_initialize() {
            let temp = table_factory_list_body_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVIN" + temp[iter].id);
            }
        }
        function onclick_table_factory_start() {
            let temp = table_factory_list_body_v.querySelectorAll('.selected');
            for (let iter in temp) {
                websocket.send("SVST" + temp[iter].id);
            }
        }

        function onclick_checkbox_mem_block() {
            let check_find = document.getElementById("checkbox_mem_block_v");
            check_find.classList.toggle("button_type_selected");
            websocket.send("CFGA" + ((check_find.classList.contains("button_type_selected")) ? "C" : "U"));
        }
        function onclick_checkbox_system() {
            let check_find = document.getElementById("checkbox_system_v");
            check_find.classList.toggle("button_type_selected");
            websocket.send("CFGB" + ((check_find.classList.contains("button_type_selected")) ? "C" : "U"));
        }
        function onclick_checkbox_user() {
            let check_find = document.getElementById("checkbox_user_v");
            check_find.classList.toggle("button_type_selected");
            websocket.send("CFGC" + ((check_find.classList.contains("button_type_selected")) ? "C" : "U"));
        }

        window.addEventListener("load", init, false);
    </script>

</BODY >
</HTML >
