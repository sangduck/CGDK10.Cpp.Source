        function on_message(_event) {
            let message_type = _event.data.substring(0, 4);

            if (message_type == 'CELO') {
                on_messsage_executor_list(_event.data);
            }
            else if (message_type == 'CEBO') {
                on_messsage_executable_list(_event.data);
            }
            else if (message_type == 'CSLO') {
                on_messsage_schedulable_list(_event.data);
            }
        }

        function on_message_log(message) {
            let pre = document.createElement("div");
            pre.style.wordWrap = "break-word";
            pre.innerHTML = message.slice(4);
            div_log_output.appendChild(pre);
            div_log_output.scrollTo(0, div_log_output.scrollTop + pre.scrollHeight);
        }
        function on_messsage_executor_list(message)
        {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get command type
                let command = message[pos_buf];
                ++pos_buf;

                // 3) execute command (A:Add, D:delete, U:update)
                switch (command) {
                    case 'L': // add new
                        {
                            // - set flag
                            {
                                let check_find = document.getElementById("button_executor_system_v");
                                let flag = message[pos_buf];
                                ++pos_buf;
                                if ((flag == 'C'))
                                    check_find.classList.add("button_type_selected");
                                else
                                    check_find.classList.remove("button_type_selected");
                            }
                            {
                                let check_find = document.getElementById("button_executor_user_v");
                                let flag = message[pos_buf];
                                ++pos_buf;
                                if ((flag == 'C'))
                                    check_find.classList.add("button_type_selected");
                                else
                                    check_find.classList.remove("button_type_selected");
                            }

                            // - clear table
                            table_executor_list_v.innerHTML = "";

                            while (pos_buf < len_buf) {
                                // - get element id
                                let pos_buf_new = message.indexOf('\n', pos_buf);

                                if (pos_buf_new == pos_buf) {
                                   pos_buf = pos_buf_new + 1;
                                   break;
                                }

                                let element_id = message.substring(pos_buf, pos_buf_new);
                                pos_buf = pos_buf_new + 1;

                                // - get element length
                                pos_buf_new = message.indexOf('\n', pos_buf);
                                let value_length = Number(message.substring(pos_buf, pos_buf_new));
                                pos_buf = pos_buf_new + 1;

                                // - get element innnerHTML;
                                let value = message.substring(pos_buf, pos_buf + value_length);
                                pos_buf = pos_buf + value_length;

                                // - add
                                let pre = document.createElement("ul");
                                pre.innerHTML = value;
                                pre.style = "padding:0px;width:420px;border-bottom-color:#333;border-bottom-style:dotted;border-bottom-width:1px";
                                pre.id = element_id;
                                pre.addEventListener("click", onclick_table_executor_list);
                                pre.addEventListener("dblclick", ondblclick_table_executor_list);
                                table_executor_list_v.appendChild(pre);
                            }
                        }
                        break;

                    case 'A': // add new
                        {
                            // - get element id
                            let pos_buf_new = message.indexOf('\n', pos_buf);
                            let element_id = message.substring(pos_buf, pos_buf_new);
                            pos_buf = pos_buf_new + 1;

                            // - get element length
                            pos_buf_new = message.indexOf('\n', pos_buf);
                            let value_length = Number(message.substring(pos_buf, pos_buf_new));
                            pos_buf = pos_buf_new + 1;

                            // - get element innnerHTML;
                            let value = message.substring(pos_buf, pos_buf + value_length);
                            pos_buf = pos_buf + value_length;

                            // - add
                            let pre = document.createElement("ul");
                            pre.innerHTML = value;
                            pre.style = "padding:0px;width:420px;border-bottom-color:#333;border-bottom-style:dotted;border-bottom-width:1px";
                            pre.id = element_id;
                            pre.addEventListener("click", onclick_table_executor_list);
                            pre.addEventListener("dblclick", ondblclick_table_executor_list);
                            table_executor_list_v.appendChild(pre);
                        }
                        break;

                    case 'D': // delete
                        {
                            // - get element id
                            let pos_buf_new = message.indexOf('\n', pos_buf);
                            let element_id = message.substring(pos_buf, pos_buf_new);
                            pos_buf = pos_buf_new + 1;

                            // - delete 
                            table_executor_list_v.removeChild(document.getElementById(element_id));
                        }
                        break;

                    case 'U': // update
                        {
                            // - get element id
                            let pos_buf_new = message.indexOf('\n', pos_buf);
                            let element_id = message.substring(pos_buf, pos_buf_new);
                            pos_buf = pos_buf_new + 1;

                            // - executor name
                            {
                                // - find element
                                let element_update = document.getElementById(element_id);

                                // check) set 
                                if (element_update == null)
                                    return;

                                // - get child noes
                                let child_nodes = element_update.childNodes;

                                // - get value
                                pos_buf_new = message.indexOf('\n', pos_buf);
                                let value = message.substring(pos_buf, pos_buf_new);
                                pos_buf = pos_buf_new + 1;

                                // - set name
                                child_nodes[0].childNodes[1].textContent = value;
                            }

                            // - get thread count
                            pos_buf_new = message.indexOf('\n', pos_buf);
                            let count_thread = Number(message.substring(pos_buf, pos_buf_new));
                            pos_buf = pos_buf_new + 1;

                            for (let i=0; i<count_thread; ++i)
                            {
                                // - get thread id
                                pos_buf_new = message.indexOf('\n', pos_buf);
                                let thread_id = message.substring(pos_buf, pos_buf_new);
                                pos_buf = pos_buf_new + 1;

                                // - find element
                                let element_thread = document.getElementById(thread_id);
                                let child_nodes = element_thread.childNodes;

                                for (let j = 2; j<4; ++j)
                                {
                                    // - get executed
                                    pos_buf_new = message.indexOf('\n', pos_buf);
                                    let value_text = Number(message.substring(pos_buf, pos_buf_new));
                                    pos_buf = pos_buf_new + 1;

                                    // - thread get child node
                                    if (child_nodes[j].textContent != value_text) {
                                        child_nodes[j].textContent = value_text;
                                        child_nodes[j].style.color = "#00f";
                                        setTimeout(function (node) { node.style.color = "#000"; }, 1000, child_nodes[j]);
                                    }
                                }
                            }
                        }
                        break;
                }
            }
        }

        function on_messsage_event_general(message) {
            let pos_buf = 4;

            while (pos_buf < len_buf) {
                // 1) get key
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let key = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 2) get length
                pos_buf_new = message.indexOf('\n', pos_buf);
                let value_length = Number(message.substring(pos_buf, pos_buf_new));
