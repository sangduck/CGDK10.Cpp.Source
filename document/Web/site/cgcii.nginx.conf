# CGCII 웹사이트를 nginx 80 포트로 내보내는 설정 (HARMATTAN 192.168.0.92).
# 방법 A (권장, 정적 파일 직접 서비스):
#   sudo mkdir -p /var/www/cgcii && sudo cp -r ~/cgcii_web/. /var/www/cgcii/
#   sudo cp ~/cgcii_web/cgcii.nginx.conf /etc/nginx/sites-available/cgcii
#   sudo ln -sf /etc/nginx/sites-available/cgcii /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# 방법 B (run.sh 로 띄운 8080 을 프록시): 아래 location 블록을 proxy_pass http://127.0.0.1:8080; 으로 바꾼다.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/cgcii;
    index index.html;
    charset utf-8;
    location / {
        try_files $uri $uri/ =404;
    }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
