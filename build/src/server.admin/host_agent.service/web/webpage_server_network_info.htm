    <script>
        var websocket;
        var table_connective_list_v;
        var table_binder_list_v;

        function init() {
            table_connvective_list_v = document.getElementById("table_conective_list_n");
            table_binder_list_v = document.getElementById("table_binder_list_n");
        }

        function on_message(_event) {
            let message_type = _event.data.substring(0, 4);

            if (message_type == 'CCTO') {
                on_messsage_connective_list(_event.data);
            }
            else if (message_type == 'CBDO') {
                on_messsage_binder_list(_event.data);
            }
        }
        function on_message_log(message) {
            let pre = document.createElement("div");
            pre.style.wordWrap = "break-word";
            pre.innerHTML = message.slice(4);
            div_log_output.appendChild(pre);
            div_log_output.scrollTo(0, div_log_output.scrollTop + pre.scrollHeight);
        }
        function on_messsage_connective_list(message)
        {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get command type
                let command = message[pos_buf];
                ++pos_buf;

                // 2) get element id
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let element_id = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 3) execute command
                switch (command) {
                    case 'A': // add new
                        {
                            // - get element length
                            pos_buf_new = message.indexOf('\n', pos_buf);
                            let value_length = Number(message.substring(pos_buf, pos_buf_new));
                            pos_buf = pos_buf_new + 1;

                            // - get element innnerHTML;
                            let value = message.substring(pos_buf, pos_buf + value_length);
                            pos_buf = pos_buf + value_length;

                            // - add
                            let pre = document.createElement("tr");
                            pre.innerHTML = value;
                            pre.id = element_id;
                            pre.addEventListener("click", onclick_table_connective_list);
                            pre.addEventListener("dblclick", ondblclick_table_connective_list);
                            table_connvective_list_v.appendChild(pre);
                        }
                        break;

                    case 'D': // delete
                        {
                            // - delete 
                            table_connvective_list_v.removeChild(document.getElementById(element_id));
                        }
                        break;

                    case 'U':
                        {
                            // - find element
                            let element_update = document.getElementById(element_id);

                            // check) set 
                            if (element_update == null)
                                return;

                            // - get child noes
                            let child_nodes = element_update.childNodes;

                            // - executor name
                            {
                                // - get value
                                pos_buf_new = message.indexOf('\n', pos_buf);
                                let value = message.substring(pos_buf, pos_buf_new);
                                pos_buf = pos_buf_new + 1;

                                // - set name
                                child_nodes[0].childNodes[0].childNodes[1].textContent = value;
                            }

                            for (let i = 1; i < 10; ++i)
                            {
                                // - get value
                                pos_buf_new = message.indexOf('\n', pos_buf);
                                let value_text = message.substring(pos_buf, pos_buf_new);
                                pos_buf = pos_buf_new + 1;

                                // - thread get child node
                                let node = child_nodes[i];
                                if (node.textContent != value_text) {
                                    node.textContent = value_text;
                                    node.style.color = "#00f";
                                    setTimeout(function (node) { node.style.color = "#000"; }, 1000, node);
                                }
                            }
                        }
                        break;
                }
            }
        }

                            // - get child noes

        }
        function on_messsage_event_general(message) {
            let pos_buf = 4;
            let len_buf = message.length;

            while (pos_buf < len_buf) {
                // 1) get key
                let pos_buf_new = message.indexOf('\n', pos_buf);
                let key = message.substring(pos_buf, pos_buf_new);
                pos_buf = pos_buf_new + 1;

                // 2) get length
                pos_buf_new = message.indexOf('\n', pos_buf);
                let value_length = Number(message.substring(pos_buf, pos_buf_new));
                pos_buf = pos_buf_new + 1;

                // 3) get value;
                let value = message.substring(pos_buf, pos_buf + value_length);
                pos_buf = pos_buf + value_length;

                // 4) fine element
                let element_key = document.getElementById(key);

                if (element_key == null)
                    continue;

                // 5) set value
                element_key.innerHTML = value;
            }
        }
